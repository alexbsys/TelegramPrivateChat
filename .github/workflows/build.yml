name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create api_keys.properties
      run: |
        echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" > api_keys.properties
        echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> api_keys.properties
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK
      run: ./gradlew :TMessagesProj_App:assembleAfatDebug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-debug-apk
        path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
        retention-days: 14

  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create api_keys.properties
      run: |
        echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" > api_keys.properties
        echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> api_keys.properties
    
    - name: Setup Keystore
      if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Release APK
      env:
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      run: ./gradlew :TMessagesProj_App:assembleAfatRelease
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-release-apk
        path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
        retention-days: 30

