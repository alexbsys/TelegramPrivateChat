name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Allow manual trigger

env:
  # Shared cleanup script
  CLEANUP_SCRIPT: |
    echo "=== Before cleanup ===" && df -h
    sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
      /opt/hostedtoolcache/node /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
      /usr/local/graalvm /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
      /usr/local/lib/android/sdk/ndk/21.* /usr/local/lib/android/sdk/ndk/22.* \
      /usr/local/lib/android/sdk/ndk/23.* /usr/local/lib/android/sdk/ndk/24.* 2>/dev/null || true
    sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
      azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox 2>/dev/null || true
    sudo apt-get autoremove -y && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
    sudo docker system prune --all --force 2>/dev/null || true
    echo "=== After cleanup ===" && df -h

jobs:
  build-arm64-debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free disk space
      run: |
        echo "=== Before cleanup ===" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
          /opt/hostedtoolcache/node /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
          /usr/local/graalvm /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
          /usr/local/lib/android/sdk/ndk/21.* /usr/local/lib/android/sdk/ndk/22.* \
          /usr/local/lib/android/sdk/ndk/23.* /usr/local/lib/android/sdk/ndk/24.* 2>/dev/null || true
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
          azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox 2>/dev/null || true
        sudo apt-get autoremove -y && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
        sudo docker system prune --all --force 2>/dev/null || true
        echo "=== After cleanup ===" && df -h

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create api_keys.properties
      run: |
        echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" > api_keys.properties
        echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> api_keys.properties
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build ARM64 Debug APK
      run: |
        ./gradlew :TMessagesProj_App:assembleArm64Debug --no-daemon --max-workers=2
        echo "=== Disk after build ===" && df -h
    
    - name: Upload ARM64 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-arm64-debug-apk
        path: TMessagesProj_App/build/outputs/apk/arm64/debug/*.apk
        retention-days: 14

  # Optional: Build for ARMv7 (older devices) - manual trigger only
  build-armv7-debug:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Free disk space
      run: |
        echo "=== Before cleanup ===" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
          /opt/hostedtoolcache/node /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
          /usr/local/graalvm /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
          /usr/local/lib/android/sdk/ndk/21.* /usr/local/lib/android/sdk/ndk/22.* \
          /usr/local/lib/android/sdk/ndk/23.* /usr/local/lib/android/sdk/ndk/24.* 2>/dev/null || true
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
          azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox 2>/dev/null || true
        sudo apt-get autoremove -y && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
        sudo docker system prune --all --force 2>/dev/null || true
        echo "=== After cleanup ===" && df -h

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create api_keys.properties
      run: |
        echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" > api_keys.properties
        echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> api_keys.properties
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build ARMv7 Debug APK
      run: ./gradlew :TMessagesProj_App:assembleArmv7Debug --no-daemon --max-workers=2
    
    - name: Upload ARMv7 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: telegram-armv7-debug-apk
        path: TMessagesProj_App/build/outputs/apk/armv7/debug/*.apk
        retention-days: 14

  # Release build - only runs if RELEASE_KEYSTORE_BASE64 secret exists
  build-arm64-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    continue-on-error: true
    
    steps:
    - name: Check if release secrets exist
      id: check-secrets
      run: |
        if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "has_secrets=false" >> $GITHUB_OUTPUT
          echo "⚠️ Release secrets not configured, skipping release build"
        else
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Free disk space
      if: steps.check-secrets.outputs.has_secrets == 'true'
      run: |
        echo "=== Before cleanup ===" && df -h
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
          /opt/hostedtoolcache/node /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
          /usr/local/graalvm /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" \
          /usr/local/lib/android/sdk/ndk/21.* /usr/local/lib/android/sdk/ndk/22.* \
          /usr/local/lib/android/sdk/ndk/23.* /usr/local/lib/android/sdk/ndk/24.* 2>/dev/null || true
        sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' \
          azure-cli google-cloud-sdk microsoft-edge-stable google-chrome-stable firefox 2>/dev/null || true
        sudo apt-get autoremove -y && sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*
        sudo docker system prune --all --force 2>/dev/null || true
        echo "=== After cleanup ===" && df -h
    
    - name: Checkout repository
      if: steps.check-secrets.outputs.has_secrets == 'true'
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      if: steps.check-secrets.outputs.has_secrets == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      if: steps.check-secrets.outputs.has_secrets == 'true'
      uses: android-actions/setup-android@v3
    
    - name: Create api_keys.properties
      if: steps.check-secrets.outputs.has_secrets == 'true'
      run: |
        echo "TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}" > api_keys.properties
        echo "TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}" >> api_keys.properties
    
    - name: Setup Keystore
      if: steps.check-secrets.outputs.has_secrets == 'true'
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/config/release.keystore
    
    - name: Grant execute permission for gradlew
      if: steps.check-secrets.outputs.has_secrets == 'true'
      run: chmod +x gradlew
    
    - name: Build ARM64 Release APK
      if: steps.check-secrets.outputs.has_secrets == 'true'
      env:
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      run: ./gradlew :TMessagesProj_App:assembleArm64Release --no-daemon --max-workers=2
    
    - name: Upload ARM64 Release APK
      if: steps.check-secrets.outputs.has_secrets == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: telegram-arm64-release-apk
        path: TMessagesProj_App/build/outputs/apk/arm64/release/*.apk
        retention-days: 30
